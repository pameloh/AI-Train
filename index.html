<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ИИ-тренер</title>
<style>
:root{--bg:#0b0b12;--card:#161622;--line:#2a2a3d;--tx:#f2f2f8;--mut:#8d8da6;--g:#39ff14;--v:#a855f7;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:26px;margin:8px 0 4px}h1 b{color:var(--g)}h2{font-size:18px;margin:18px 0 8px}
.mut{color:var(--mut);font-size:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#101019;color:var(--tx);font-size:15px;cursor:pointer}
.chip.on{border-color:var(--g);color:var(--g);box-shadow:0 0 0 1px var(--g) inset}
label{display:block;margin:14px 0 6px;font-weight:600}
input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#101019;color:var(--tx);font-size:16px}
input:focus,textarea:focus{outline:none;border-color:var(--v)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:0;font-size:17px;font-weight:700;background:var(--g);color:#06100a;cursor:pointer;margin-top:16px}
.btn.v{background:var(--v);color:#fff}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn:disabled{opacity:.5}
.row{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;align-items:center;margin:6px 0}
.row span{color:var(--v);font-weight:700}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;background:rgba(168,85,247,.18);color:var(--v);font-size:13px;font-weight:600}
.rec{color:var(--g);font-size:14px;margin:4px 0}
.err{color:#ff5c7a;margin-top:10px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0f0f19;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 4px;background:none;border:0;color:var(--mut);font-size:14px;font-weight:600}
nav button.on{color:var(--g)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--g);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--v),var(--g));transition:width .3s}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mg{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;color:var(--c);border:1px solid var(--c);text-transform:uppercase;letter-spacing:.04em}
.lnk{background:none;border:0;color:var(--v);font-weight:600;font-size:14px;padding:6px;cursor:pointer}
details.wu{margin:8px 0}details.wu summary{color:var(--v);font-size:14px;cursor:pointer}details.wu div{margin-top:6px}
.alts{display:flex;flex-direction:column;gap:6px;margin-top:6px}.alts .chip{text-align:left}.alts small{display:block;color:var(--mut);font-size:12px}
.fade{animation:f .35s ease both}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade,.bar i{animation:none;transition:none}}
</style></head><body><div id="app"></div><nav id="nav"></nav>
<script>
const KEY='ai_trainer_v1';
const API_URL='https://YOUR-WORKER.workers.dev'; // сюда адрес твоего Cloudflare Worker
const AI_ON=/^https:\/\/\S+$/.test(API_URL)&&!API_URL.includes('YOUR-WORKER');
const fresh=()=>({profile:null,plan:null,history:[],rec:{},view:'form',day:0,draft:{}});
let S=load(),busy=false,err='',tmp={goal:'',level:'',days:0};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&typeof s==='object'?Object.assign(fresh(),s):fresh()}catch(e){return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GOAL={mass:'Набор мышц',fat:'Похудение',str:'Сила'};
const LVL={new:'Новичок',mid:'Средний',pro:'Опытный'};
const num=v=>{v=String(v??'').replace(',','.').trim();return v===''?null:Number(v)};

/* ---------- ИИ ---------- */
async function ai(prompt){
  if(!AI_ON)throw new Error('noai');
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),25000);
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt}),signal:c.signal});
    if(!r.ok)throw new Error('http'+r.status);
    const j=await r.json(),x=String(j.text||''),a=x.indexOf('{'),b=x.lastIndexOf('}');
    return JSON.parse(x.slice(a,b+1));
  }finally{clearTimeout(tm)}
}
const GROUPS=['грудь','спина','ноги','плечи','руки','другое'];
const MC={грудь:'#39ff14',спина:'#a855f7',ноги:'#22d3ee',плечи:'#f59e0b',руки:'#ec4899',другое:'#8d8da6'};
const POOL={
 грудь:['Жим гантелей лёжа','Отжимания на брусьях','Разведение гантелей лёжа','Сведение рук в кроссовере','Жим в тренажёре на грудь'],
 спина:['Тяга нижнего блока','Тяга в тренажёре','Подтягивания','Тяга Т-грифа','Пуловер на блоке'],
 ноги:['Жим ногами','Выпады с гантелями','Болгарские сплит-приседания','Разгибания ног в тренажёре','Ягодичный мостик'],
 плечи:['Махи гантелей в стороны','Жим Арнольда','Жим в тренажёре на плечи','Обратные разведения','Тяга к подбородку'],
 руки:['Молотковые сгибания','Французский жим','Сгибания на скамье Скотта','Разгибания рук канатом','Сгибания рук на нижнем блоке']};
function guessM(n){n=n.toLowerCase();
 if(/сгибани\S* рук|разгибани\S* рук|бицепс|трицепс|молот|французск/.test(n))return'руки';
 if(/присед|ног|выпад|икр|носки|румын|ягодич/.test(n))return'ноги';
 if(/тяга|подтяг|пуловер/.test(n))return'спина';
 if(/сидя|плеч|махи|армейск|арнольд/.test(n))return'плечи';
 if(/жим|лёжа|разведен|отжим|кроссовер|груд|брус/.test(n))return'грудь';
 return'другое'}
const grp=e=>GROUPS.includes(e.m)?e.m:guessM(e.name);
const r25=x=>Math.round(x/2.5)*2.5;
function wuText(i){
  const e=S.plan.days[S.day].exercises[i],v=S.draft[i+'-0']||{};
  const w=num(v.w)>0?num(v.w):(S.rec[e.name]&&S.rec[e.name].weight>0?S.rec[e.name].weight:null);
  if(w==null)return'Введи рабочий вес в первом подходе, и я посчитаю разминку.';
  if(w<10)return'С таким весом разминка не нужна.';
  const out=[];for(const[p,r]of[[.5,8],[.7,5],[.85,3]]){const x=r25(w*p);if(x>0&&!out.some(o=>o[0]===x))out.push([x,r])}
  return'Перед рабочим весом '+w+' кг: '+out.map(o=>o[0]+' кг × '+o[1]).join(' → ');
}
async function altsFor(i){
  const d=S.plan.days[S.day],e=d.exercises[i],g=grp(e),have=d.exercises.map(x=>x.name);
  const prompt=`Ты тренер в тренажёрном зале. Предложи 3 замены упражнения «${e.name}» (группа мышц: ${g}). Травмы и ограничения клиента: ${S.profile.injuries||'нет'}. Уровень: ${LVL[S.profile.level]}. Нельзя предлагать то, что уже есть в тренировке: ${have.join(', ')}. Только оборудование зала.
Ответь ТОЛЬКО JSON: {"alts":[{"name":"название","why":"до 6 слов, чем хорошо"}]}`;
  try{const r=await ai(prompt);
    const a=(r.alts||[]).filter(x=>x&&typeof x.name==='string'&&x.name.length<60&&!have.includes(x.name)).slice(0,3).map(x=>({name:x.name,why:String(x.why||'').slice(0,60)}));
    if(a.length)return a}catch(er){}
  const pool=g==='другое'?Object.values(POOL).flat():POOL[g];
  return pool.filter(n=>!have.includes(n)).slice(0,3).map(n=>({name:n,why:''}));
}
let altsTmp={};
async function swap(i){
  const el=document.getElementById('alt'+i);if(!el)return;
  el.innerHTML='<div class="mut" style="margin-top:8px"><span class="spin"></span>Подбираю замену…</div>';
  const list=await altsFor(i);altsTmp[i]=list;
  const el2=document.getElementById('alt'+i);if(!el2)return;
  el2.innerHTML=list.length?`<div class="mut" style="margin-top:8px">Заменится в плане насовсем:</div><div class="alts">${list.map((a,k)=>`<button class="chip" data-alt="${i}|${k}">${esc(a.name)}${a.why?`<small>${esc(a.why)}</small>`:''}</button>`).join('')}</div>`:'<div class="mut">Замен не нашлось.</div>';
}
function applyAlt(i,k){
  const a=altsTmp[i]&&altsTmp[i][k];if(!a)return;
  const ex=S.plan.days[S.day].exercises[i];ex.m=grp(ex);ex.name=a.name;
  for(const key of Object.keys(S.draft))if(key.startsWith(i+'-'))delete S.draft[key];
  altsTmp={};save();render();
}
function prog(){
  const d=S.plan.days[S.day];let n=0,t=0;
  d.exercises.forEach((e,i)=>{for(let j=0;j<e.sets;j++){t++;const v=S.draft[i+'-'+j]||{};if(String(v.w??'').trim()!==''&&String(v.r??'').trim()!=='')n++}});
  const b=document.getElementById('pb'),x=document.getElementById('pt');
  if(b)b.style.width=(t?n/t*100:0)+'%';if(x)x.textContent='Заполнено подходов: '+n+' из '+t;
}
function chart(){
  const v=S.history.slice(-8).map(h=>h.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.w!=null?s.w*s.r:0),0),0));
  const m=Math.max(...v,1),w=300/v.length;
  return`<div class="card"><b>Объём за тренировку</b> <span class="mut">кг × повторения</span><svg viewBox="0 0 300 90" width="100%" style="margin-top:8px">${v.map((x,i)=>{const h=Math.max(2,x/m*70);return`<rect x="${i*w+4}" y="${80-h}" width="${w-8}" height="${h}" rx="4" fill="${i===v.length-1?'#39ff14':'#a855f7'}"/>`}).join('')}</svg></div>`;
}
function goalReps(g){return g==='str'?'3-6':g==='fat'?'10-15':'8-12'}
function validPlan(p){
  if(!p||!Array.isArray(p.days)||p.days.length<1||p.days.length>7)return false;
  return p.days.every(d=>d&&typeof d.name==='string'&&Array.isArray(d.exercises)&&d.exercises.length>0&&d.exercises.length<=10&&
    d.exercises.every(e=>e&&typeof e.name==='string'&&e.name&&Number.isInteger(e.sets)&&e.sets>=1&&e.sets<=8&&/^\d{1,2}(-\d{1,2})?$/.test(String(e.reps))));
}
function fallbackPlan(p){
  const r=goalReps(p.goal),s=p.goal==='str'?4:3;
  const X=(n,reps)=>({name:n,sets:s,reps:reps||r});
  const push=[X('Жим штанги лёжа'),X('Жим гантелей на наклонной скамье'),X('Жим гантелей сидя'),X('Разгибания рук на блоке','10-15')];
  const pull=[X('Тяга верхнего блока'),X('Тяга штанги в наклоне'),X('Тяга гантели одной рукой'),X('Сгибания рук с гантелями','10-15')];
  const legs=[X('Приседания со штангой'),X('Румынская тяга'),X('Жим ногами'),X('Сгибания ног лёжа','10-15')];
  const full=[push[0],pull[0],legs[0],push[2],pull[1],legs[2]];
  const up=push.slice(0,2).concat(pull.slice(0,2),[pull[3]]),low=legs.concat([X('Подъём на носки','12-20')]);
  const n=p.days,D=[];
  if(n<=3)for(let i=0;i<n;i++)D.push({name:'Всё тело '+'ABC'[i],exercises:full});
  else if(n===4)D.push({name:'Верх A',exercises:up},{name:'Низ A',exercises:low},{name:'Верх B',exercises:up},{name:'Низ B',exercises:low});
  else{D.push({name:'Жим',exercises:push},{name:'Тяга',exercises:pull},{name:'Ноги',exercises:legs},{name:'Верх',exercises:up},{name:'Низ',exercises:low});if(n===6)D.push({name:'Ноги 2',exercises:legs})}
  return{days:D,note:'План составлен по готовому шаблону (ИИ сейчас недоступен).'};
}
async function makePlan(){
  const p=S.profile;
  const prompt=`Ты персональный тренер в тренажёрном зале. Составь недельный план.
Данные: цель — ${GOAL[p.goal]}, уровень — ${LVL[p.level]}, тренировок в неделю — ${p.days}, рост ${p.height||'не указан'} см, вес ${p.weight||'не указан'} кг, возраст ${p.age||'не указан'}, травмы/ограничения: ${p.injuries||'нет'}.
Ровно ${p.days} дней, 4-6 упражнений в день, только для зала. Для каждого упражнения: подходы и диапазон повторений (норма).
Ответь ТОЛЬКО JSON без пояснений: {"days":[{"name":"название дня","exercises":[{"name":"упражнение","m":"грудь","sets":3,"reps":"8-12"}]}],"note":"1-2 предложения совета по плану"}
Поле reps строго вида "8-12" или "5". Поле m — одна из: грудь, спина, ноги, плечи, руки, другое. Пиши на русском.`;
  try{const pl=await ai(prompt);if(validPlan(pl))return{days:pl.days.map(d=>({name:d.name,exercises:d.exercises.map(e=>({name:e.name,m:e.m,sets:e.sets,reps:String(e.reps)}))})),note:String(pl.note||'')};}catch(e){}
  return fallbackPlan(p);
}
function repRange(r){const m=String(r).split('-').map(Number);return[m[0],m[1]||m[0]]}
function fallbackCoach(log){
  const next=[];
  for(const ex of log.ex){
    const done=ex.sets.filter(s=>s.w!=null&&s.r!=null);if(!done.length)continue;
    const [lo,hi]=repRange(ex.reps),top=Math.max(...done.map(s=>s.w)),at=done.filter(s=>s.w===top);
    let w=top,note='Оставь вес, добери повторения.';
    if(at.every(s=>s.r>=hi)&&at.length>=Math.min(ex.setsPlanned,2)){w=top+(top>=40?2.5:1.25);note='Все повторения выполнены, прибавляем вес.'}
    else if(at.every(s=>s.r<lo)){w=Math.max(0,top-(top>=40?5:2.5));note='Слишком тяжело, снижаем вес.'}
    next.push({exercise:ex.name,weight:w,note});
  }
  return{summary:'Разбор по простым правилам (ИИ сейчас недоступен): если во всех подходах выполнил верхнюю норму повторений — вес растёт, если не дотянул до нижней — снижаем.',next};
}
async function coach(log){
  const hist=S.history.slice(-4).map(h=>({date:h.date,day:h.day,ex:h.ex.map(e=>({name:e.name,sets:e.sets.map(s=>`${s.w}кг x${s.r}`)}))}));
  const prompt=`Ты персональный тренер. Клиент: цель — ${GOAL[S.profile.goal]}, уровень — ${LVL[S.profile.level]}.
Только что выполненная тренировка (день «${log.day}»), нормы повторений в reps: ${JSON.stringify(log.ex.map(e=>({name:e.name,reps:e.reps,sets:e.sets.map(s=>s.w==null?'пропуск':`${s.w}кг x${s.r}`)})))}.
Прошлые тренировки: ${JSON.stringify(hist)}.
Реши, какой вес брать в следующий раз по каждому упражнению (прогрессия: выполнил верх нормы во всех подходах — прибавь; не дотянул до низа — снизь; иначе оставь). Если подходы пропущены — не выдумывай.
Ответь ТОЛЬКО JSON: {"summary":"2-3 предложения разбора по-русски","next":[{"exercise":"точное название упражнения","weight":число_кг,"note":"коротко что делать"}]}`;
  try{const r=await ai(prompt);
    if(r&&typeof r.summary==='string'&&Array.isArray(r.next)){
      const names=log.ex.map(e=>e.name);
      const nx=r.next.filter(n=>n&&names.includes(n.exercise)&&typeof n.weight==='number'&&n.weight>=0&&n.weight<=1000).map(n=>({exercise:n.exercise,weight:n.weight,note:String(n.note||'')}));
      if(nx.length)return{summary:r.summary,next:nx};
    }}catch(e){}
  return fallbackCoach(log);
}

/* ---------- Экраны ---------- */
function nav(){
  const v=S.view,t=[['plan','План'],['history','История'],['form','Анкета']];
  $nav.innerHTML=S.profile?t.map(([k,n])=>`<button class="${v===k||(k==='plan'&&(v==='workout'||v==='result'))?'on':''}" data-go="${k}">${n}</button>`).join(''):'';
}
function render(){
  const a=document.getElementById('app');nav();
  if(S.view==='form'||!S.profile)a.innerHTML=formV();
  else if(S.view==='plan')a.innerHTML=planV();
  else if(S.view==='workout'){a.innerHTML=workV();prog()}
  else if(S.view==='result')a.innerHTML=resultV();
  else a.innerHTML=histV();
}
const $nav=document.getElementById('nav');
function chips(name,opts,cur){return`<div class="chips">${opts.map(([k,n])=>`<button type="button" class="chip ${String(cur)===String(k)?'on':''}" data-chip="${name}" data-v="${k}">${n}</button>`).join('')}</div>`}
function formV(){
  const p=S.profile||{};
  if(!tmp.goal&&p.goal)Object.assign(tmp,{goal:p.goal,level:p.level,days:p.days});
  return`<h1>ИИ-<b>тренер</b></h1><p class="mut">Ответь на пару вопросов, и получишь план для зала. Вес и повторения вводишь сам, тренер подстроит дальше.</p>
<label>Цель</label>${chips('goal',[['mass','Набор мышц'],['fat','Похудение'],['str','Сила']],tmp.goal)}
<label>Опыт в зале</label>${chips('level',[['new','Новичок'],['mid','Средний'],['pro','Опытный']],tmp.level)}
<label>Тренировок в неделю</label>${chips('days',[2,3,4,5,6].map(n=>[n,n]),tmp.days)}
<label>Рост, см (необязательно)</label><input id="f_h" inputmode="decimal" value="${esc(p.height??'')}">
<label>Вес, кг (необязательно)</label><input id="f_w" inputmode="decimal" value="${esc(p.weight??'')}">
<label>Возраст (необязательно)</label><input id="f_a" inputmode="numeric" value="${esc(p.age??'')}">
<label>Травмы и ограничения (необязательно)</label><textarea id="f_i" rows="2" maxlength="300">${esc(p.injuries??'')}</textarea>
${err?`<div class="err">${esc(err)}</div>`:''}
<button class="btn" id="mk" ${busy?'disabled':''}>${busy?'<span class="spin"></span>Составляю план…':(S.plan?'Пересоздать план':'Получить план')}</button>
<p class="mut" style="margin-top:14px">Это не медицинская рекомендация. При травмах и болезнях сначала к врачу. Для составления плана текст анкеты отправляется ИИ-сервису. История тренировок хранится только в твоём браузере.</p>
${S.profile?`<button class="btn ghost" id="rs">Стереть все данные</button>`:''}`;
}
function planV(){
  const p=S.plan;
  return`<h1>Твой <b>план</b></h1><div class="mut">${GOAL[S.profile.goal]} · ${LVL[S.profile.level]} · ${S.profile.days} дн/нед</div>
${p.note?`<div class="card">${esc(p.note)}</div>`:''}
${p.days.map((d,i)=>`<div class="card"><b>${esc(d.name)}</b> <span class="tag">день ${i+1}</span>
${d.exercises.map(e=>`<div style="margin-top:8px">${esc(e.name)} <span class="mut">— ${e.sets} × ${esc(e.reps)}</span></div>`).join('')}
<button class="btn v" data-start="${i}">Начать тренировку</button></div>`).join('')}`;
}
function workV(){
  const d=S.plan.days[S.day];
  return`<h1>${esc(d.name)}</h1><div class="bar"><i id="pb"></i></div><div class="mut" id="pt"></div>
${d.exercises.map((e,i)=>{const r=S.rec[e.name],g=grp(e);return`<div class="card fade" id="ex${i}"><div class="top"><span class="mg" style="--c:${MC[g]}">${g}</span><button class="lnk" data-sw="${i}">Заменить</button></div>
<b>${esc(e.name)}</b><div class="mut">норма: ${e.sets} × ${esc(e.reps)}</div>
${r?`<div class="rec">Тренер советует: ${r.weight} кг. ${esc(r.note)}</div>`:'<div class="mut">Подбери вес, с которым выполнишь норму.</div>'}
<details class="wu"><summary>Разминка</summary><div id="wu${i}" class="mut">${esc(wuText(i))}</div></details>
<div id="alt${i}"></div>
${Array.from({length:e.sets},(_,j)=>{const v=S.draft[i+'-'+j]||{};return`<div class="row"><span>${j+1}</span><input inputmode="decimal" placeholder="кг" data-d="${i}-${j}" data-k="w" value="${esc(v.w??'')}"><input inputmode="numeric" placeholder="повт." data-d="${i}-${j}" data-k="r" value="${esc(v.r??'')}"></div>`}).join('')}</div>`}).join('')}
${err?`<div class="err">${esc(err)}</div>`:''}
<button class="btn" id="fin" ${busy?'disabled':''}>${busy?'<span class="spin"></span>Тренер думает…':'Завершить тренировку'}</button>
<button class="btn ghost" id="cancel">Назад</button>`;
}
function resultV(){
  const r=S.last;if(!r)return'';
  return`<h1>Ответ <b>тренера</b></h1><div class="card">${esc(r.summary)}</div><h2>В следующий раз</h2>
${r.next.map(n=>`<div class="card"><b>${esc(n.exercise)}</b><div class="rec">${n.weight} кг</div><div class="mut">${esc(n.note)}</div></div>`).join('')}
<button class="btn" data-go="plan">К плану</button>`;
}
function histV(){
  if(!S.history.length)return`<h1><b>История</b></h1><p class="mut">Пока пусто. Закончи первую тренировку.</p>`;
  return`<h1><b>История</b></h1>`+(S.history.length>1?chart():'')+S.history.slice().reverse().map(h=>`<div class="card"><b>${esc(h.day)}</b> <span class="mut">${esc(h.date)}</span>
${h.ex.map(e=>`<div style="margin-top:8px">${esc(e.name)}<div class="mut">${e.sets.filter(s=>s.w!=null).map(s=>`${s.w}×${s.r}`).join(' · ')||'пропущено'}</div></div>`).join('')}</div>`).join('');
}

/* ---------- Действия ---------- */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button');if(!t)return;
  if(t.dataset.chip){tmp[t.dataset.chip]=t.dataset.v;snapForm();render();return}
  if(t.dataset.go){err='';S.view=t.dataset.go;save();render();return}
  if(t.dataset.start!==undefined){S.day=+t.dataset.start;S.draft={};err='';S.view='workout';save();render();return}
  if(t.dataset.sw!==undefined){swap(+t.dataset.sw);return}
  if(t.dataset.alt){const[i,k]=t.dataset.alt.split('|');applyAlt(+i,+k);return}
  if(t.id==='cancel'){S.view='plan';save();render();return}
  if(t.id==='rs'){if(t.dataset.sure){S=fresh();tmp={goal:'',level:'',days:0};try{localStorage.removeItem(KEY)}catch(e){}render()}else{t.dataset.sure=1;t.textContent='Точно стереть? Нажми ещё раз'}return}
  if(t.id==='mk')return submitForm();
  if(t.id==='fin')return finish();
});
let ft={};function snapForm(){for(const[k,id]of[['height','f_h'],['weight','f_w'],['age','f_a'],['injuries','f_i']]){const e=document.getElementById(id);if(e)ft[k]=e.value}}
document.addEventListener('input',e=>{
  const i=e.target;if(i.dataset.d){const[k]=[i.dataset.k];S.draft[i.dataset.d]=Object.assign(S.draft[i.dataset.d]||{},{[k]:i.value});save();prog();if(k==='w'&&i.dataset.d.endsWith('-0')){const ix=i.dataset.d.split('-')[0],el=document.getElementById('wu'+ix);if(el)el.textContent=wuText(+ix)}}
});
async function submitForm(){
  if(busy)return;
  const g=(id)=>document.getElementById(id).value;
  const h=num(g('f_h')),w=num(g('f_w')),a=num(g('f_a'));
  if(!tmp.goal||!tmp.level||!tmp.days){err='Выбери цель, опыт и число тренировок.';render();return}
  const bad=(v,lo,hi)=>v!=null&&(!isFinite(v)||v<lo||v>hi);
  if(bad(h,100,250)){err='Рост должен быть от 100 до 250 см.';render();return}
  if(bad(w,25,400)){err='Вес должен быть от 25 до 400 кг.';render();return}
  if(bad(a,10,100)){err='Возраст должен быть от 10 до 100.';render();return}
  S.profile={goal:tmp.goal,level:tmp.level,days:+tmp.days,height:h,weight:w,age:a,injuries:g('f_i').trim()};
  err='';busy=true;render();
  S.plan=await makePlan();S.rec={};S.view='plan';busy=false;save();render();
}
async function finish(){
  if(busy)return;
  const d=S.plan.days[S.day],ex=[];let any=false;
  for(let i=0;i<d.exercises.length;i++){
    const e=d.exercises[i],sets=[];
    for(let j=0;j<e.sets;j++){
      const v=S.draft[i+'-'+j]||{},w=num(v.w),r=num(v.r);
      if(w==null&&r==null){sets.push({w:null,r:null});continue}
      if(w==null||r==null||!isFinite(w)||!isFinite(r)||w<0||w>1000||!Number.isInteger(r)||r<1||r>100){err=`«${e.name}», подход ${j+1}: вес от 0 до 1000 кг, повторения целым числом от 1 до 100.`;render();return}
      sets.push({w,r});any=true;
    }
    ex.push({name:e.name,reps:e.reps,setsPlanned:e.sets,sets});
  }
  if(!any){err='Впиши хотя бы один подход.';render();return}
  err='';busy=true;render();
  const log={date:new Date().toLocaleDateString('ru-RU'),day:d.name,ex};
  const res=await coach(log);
  S.history.push(log);res.next.forEach(n=>S.rec[n.exercise]={weight:n.weight,note:n.note});
  S.last=res;S.draft={};S.day=(S.day+1)%S.plan.days.length;S.view='result';busy=false;save();render();
}
render();
</script></body></html>
